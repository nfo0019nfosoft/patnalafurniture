<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
My Profile
</title>

<link rel="icon"
type="image/png"
href="images/fav.png">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

background:
linear-gradient(
135deg,
#2b1408,
#874526,
#c99330
);

padding:110px 20px 30px;

overflow-x:hidden;

position:relative;
}


/* BACKGROUND */

body::before,
body::after{

content:"";

position:absolute;

border-radius:50%;

filter:blur(90px);

opacity:0.35;

z-index:-1;
}

body::before{

width:320px;
height:320px;

background:#ffd27a;

top:-120px;
left:-120px;
}

body::after{

width:300px;
height:300px;

background:#ffffff;

bottom:-120px;
right:-120px;
}


/* NAVBAR */

.navbar{

position:fixed;

top:0;
left:0;

width:100%;

padding:18px 6%;

display:flex;

justify-content:space-between;

align-items:center;

background:
rgba(0,0,0,0.18);

backdrop-filter:blur(15px);

z-index:999;
}

.logo img{

width:150px;
}


/* PROFILE BOX */

.profile-box{

width:100%;
max-width:480px;

background:
rgba(255,255,255,0.12);

backdrop-filter:blur(20px);

border:1px solid
rgba(255,255,255,0.15);

padding:45px;

border-radius:35px;

color:#fff;

text-align:center;

box-shadow:
0 15px 45px rgba(0,0,0,0.25);

animation:fadeUp 0.8s ease;
}


/* ANIMATION */

@keyframes fadeUp{

from{
opacity:0;
transform:translateY(40px);
}

to{
opacity:1;
transform:translateY(0);
}

}


/* PROFILE IMAGE */

.profile-icon{

width:120px;
height:120px;

border-radius:50%;

background:
linear-gradient(
90deg,
#874526,
#c99330
);

display:flex;

justify-content:center;

align-items:center;

margin:auto;

margin-bottom:25px;

font-size:3rem;

box-shadow:
0 10px 30px rgba(0,0,0,0.25);
}


/* USER INFO */

.profile-box h1{

font-size:2.2rem;

margin-bottom:10px;

font-weight:700;
}

.profile-email{

color:#eee;

font-size:1rem;

margin-bottom:35px;
}


/* INFO CARD */

.info-card{

background:
rgba(255,255,255,0.08);

padding:18px;

border-radius:18px;

margin-bottom:25px;

text-align:left;
}

.info-card p{

margin-bottom:10px;

font-size:0.95rem;

color:#f5f5f5;
}

.info-card span{

font-weight:600;

color:#ffd27a;
}


/* BUTTONS */

.profile-btn{

width:100%;

padding:16px;

border:none;

border-radius:14px;

margin-bottom:18px;

cursor:pointer;

font-size:1rem;

font-weight:600;

display:flex;

align-items:center;

justify-content:center;

gap:12px;

transition:0.3s;
}

.profile-btn:hover{

transform:translateY(-3px);

box-shadow:
0 10px 25px rgba(0,0,0,0.2);
}


/* BUTTON COLORS */

.orders-btn{

background:
linear-gradient(
90deg,
#874526,
#c99330
);

color:#fff;
}

.logout-btn{

background:#ff0000;

color:#fff;
}

.home-btn{

background:
rgba(255,255,255,0.1);

color:#fff;
}


/* MOBILE */

@media(max-width:600px){

.profile-box{

padding:35px 25px;

border-radius:25px;
}

.profile-box h1{

font-size:1.8rem;
}

.profile-icon{

width:100px;
height:100px;

font-size:2.5rem;
}

.logo img{

width:120px;
}

}

</style>

</head>

<body>



<!-- NAVBAR -->

<header class="navbar">

<div class="logo">

<a href="index.html">

<img src="images/logo.png">

</a>

</div>

</header>





<!-- PROFILE -->

<div class="profile-box">


<!-- ICON -->

<div class="profile-icon">

<i class="fa-solid fa-user"></i>

</div>


<!-- USERNAME -->

<h1 id="username">

User

</h1>


<!-- EMAIL -->

<p class="profile-email"
id="email">

email@gmail.com

</p>



<!-- INFO CARD -->

<div class="info-card">

<p>

<span>
Account Status :
</span>

Active

</p>

<p>

<span>
Login Method :
</span>

WhatsApp OTP

</p>

<p>

<span>
Store :
</span>

Patnala Furniture

</p>

</div>



<!-- MY ORDERS -->

<button
class="profile-btn orders-btn"
onclick="openOrders()">

<i class="fa-solid fa-box"></i>

My Orders

</button>



<!-- HOME -->

<button
class="profile-btn home-btn"
onclick="goHome()">

<i class="fa-solid fa-house"></i>

Back Home

</button>



<!-- LOGOUT -->

<button
class="profile-btn logout-btn"
onclick="logout()">

<i class="fa-solid fa-right-from-bracket"></i>

Logout

</button>


</div>





<script>

// =========================
// GET USER DATA
// =========================

const username =
localStorage.getItem(
"username"
);

const email =
localStorage.getItem(
"userEmail"
);

const token =
localStorage.getItem(
"token"
);


// =========================
// LOGIN CHECK
// =========================

if(!token){

window.location.href =
"login.html";

}


// =========================
// SHOW USER DATA
// =========================

document.getElementById(
"username"
).innerText =
username || "User";

document.getElementById(
"email"
).innerText =
email || "No Email";


// =========================
// GO HOME
// =========================

function goHome(){

window.location.href =
"index.html";

}


// =========================
// OPEN ORDERS
// =========================

function openOrders(){

window.location.href =
"myorders.html";

}


// =========================
// LOGOUT
// =========================

function logout(){

const confirmLogout =
confirm(
"Are you sure you want to logout?"
);

if(!confirmLogout) return;


// REMOVE STORAGE

localStorage.removeItem(
"token"
);

localStorage.removeItem(
"username"
);

localStorage.removeItem(
"userEmail"
);


// ALERT

alert(
"Logged Out Successfully"
);


// REDIRECT

window.location.href =
"login.html";

}

</script>

</body>

</html>
