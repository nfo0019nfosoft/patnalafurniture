<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Profile - Patnala Furniture</title>

<link rel="icon" type="image/png" href="images/fav.png">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

background:
linear-gradient(
135deg,
#2b1408,
#874526,
#c99330
);

padding:120px 20px 20px;

overflow-x:hidden;
}


/* NAVBAR */

.navbar{

position:fixed;

top:0;
left:0;

width:100%;

padding:18px 6%;

display:flex;

justify-content:space-between;

align-items:center;

background:
rgba(0,0,0,0.15);

backdrop-filter:blur(15px);

z-index:999;
}

.logo img{

width:150px;
}

.nav-icons{

display:flex;

gap:25px;
}

.nav-icons i{

font-size:1.3rem;

color:#fff;

cursor:pointer;

transition:0.3s;
}

.nav-icons i:hover{

color:#ffd27a;

transform:translateY(-2px);
}


/* PROFILE BOX */

.profile-box{

width:100%;
max-width:470px;

background:
rgba(255,255,255,0.12);

backdrop-filter:blur(18px);

border:1px solid
rgba(255,255,255,0.15);

padding:45px;

border-radius:35px;

color:#fff;

text-align:center;

box-shadow:
0 15px 40px rgba(0,0,0,0.25);

animation:fadeUp 0.8s ease;
}


/* ANIMATION */

@keyframes fadeUp{

from{
opacity:0;
transform:translateY(40px);
}

to{
opacity:1;
transform:translateY(0);
}

}


/* PROFILE ICON */

.profile-icon{

width:120px;
height:120px;

border-radius:50%;

background:
linear-gradient(
90deg,
#874526,
#c99330
);

display:flex;

justify-content:center;

align-items:center;

margin:auto;

margin-bottom:25px;

font-size:3rem;

box-shadow:
0 10px 30px rgba(0,0,0,0.25);
}


/* USERNAME */

.profile-box h1{

font-size:2rem;

margin-bottom:10px;
}

.profile-email{

color:#eee;

margin-bottom:35px;

font-size:1rem;
}


/* BUTTONS */

.profile-btn{

width:100%;

padding:16px;

border:none;

border-radius:14px;

margin-bottom:18px;

cursor:pointer;

font-size:1rem;

font-weight:600;

display:flex;

align-items:center;

justify-content:center;

gap:12px;

transition:0.3s;
}

.profile-btn:hover{

transform:translateY(-3px);

box-shadow:
0 10px 25px rgba(0,0,0,0.2);
}


/* BUTTON COLORS */

.orders-btn{

background:
linear-gradient(
90deg,
#874526,
#c99330
);

color:#fff;
}

.logout-btn{

background:#222;

color:#fff;
}

.delete-btn{

background:#ff3b3b;

color:#fff;
}


/* MOBILE */

@media(max-width:600px){

.profile-box{

padding:35px 25px;

border-radius:25px;
}

.profile-box h1{

font-size:1.7rem;
}

.profile-icon{

width:100px;
height:100px;

font-size:2.5rem;
}

.logo img{

width:120px;
}

}

</style>

</head>

<body>



<!-- NAVBAR -->

<header class="navbar">

<div class="logo">

<a href="index.html">

<img src="images/logo.png">

</a>

</div>


<div class="nav-icons">

<i class="fa-solid fa-house"
onclick="goHome()"></i>

<i class="fa-solid fa-cart-shopping"
onclick="openCart()"></i>

</div>

</header>





<!-- PROFILE -->

<div class="profile-box">


<div class="profile-icon">

<i class="fa-solid fa-user"></i>

</div>


<h1 id="username">

User

</h1>


<p class="profile-email"
id="email">

email@gmail.com

</p>



<button
class="profile-btn orders-btn"
onclick="openOrders()">

<i class="fa-solid fa-box"></i>

My Orders

</button>



<button
class="profile-btn logout-btn"
onclick="logout()">

<i class="fa-solid fa-right-from-bracket"></i>

Logout

</button>



<button
class="profile-btn delete-btn"
onclick="deleteAccount()">

<i class="fa-solid fa-trash"></i>

Delete Account

</button>


</div>





<script>

const username =
localStorage.getItem(
"username"
);

const email =
localStorage.getItem(
"userEmail"
);

const token =
localStorage.getItem(
"token"
);


// LOGIN CHECK

if(!token){

window.location.href =
"login.html";

}


// SHOW USER DATA

document.getElementById(
"username"
).innerText =
username || "User";

document.getElementById(
"email"
).innerText =
email || "No Email";


// GO HOME

function goHome(){

window.location.href =
"index.html";

}


// OPEN CART

function openCart(){

window.location.href =
"cart.html";

}


// OPEN ORDERS

function openOrders(){

window.location.href =
"myorders.html";

}


// LOGOUT

function logout(){

localStorage.removeItem(
"token"
);

localStorage.removeItem(
"username"
);

localStorage.removeItem(
"userEmail"
);

alert(
"Logged Out"
);

window.location.href =
"login.html";

}


// DELETE ACCOUNT

async function deleteAccount(){

const confirmDelete =
confirm(
"Are you sure you want to delete account?"
);

if(!confirmDelete) return;


try{

const response =
await fetch(

"https://furniturebackend-j767.onrender.com/api/auth/delete-account",

{

method:"DELETE",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

email

})

}

);


const data =
await response.json();


if(data.success){

localStorage.clear();

alert(
"Account Deleted Successfully"
);

window.location.href =
"register.html";

}
else{

alert(
data.message
);

}

}
catch(error){

console.log(error);

alert(
"Something Went Wrong"
);

}

}

</script>

</body>

</html>
