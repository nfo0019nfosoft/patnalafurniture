<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
My Profile
</title>

<link rel="icon"
type="image/png"
href="images/fav.png">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="css/profile.css">

</head>

<body>


<!-- NAVBAR -->

<header class="navbar">


<!-- LOGO -->

<div class="logo">

<a href="index.html">

<img src="images/logo.png">

</a>

</div>


<!-- NAV LINKS -->

<nav class="nav-links" id="navLinks">

<a href="cot.html">COT</a>

<a href="sofa-sets.html">SOFA SETS</a>

<a href="diwan-cot.html">DIWAN COT</a>

<a href="chair.html">CHAIR</a>

<a href="accessories.html">ACCESSORIES</a>

<a href="marriage-kit.html">MARRIAGE KIT</a>

</nav>


<!-- RIGHT SIDE -->

<div class="right-section">


<!-- ICONS -->

<div class="nav-icons">

<a href="index.html">
<i class="fas fa-house"></i>
</a>

<a href="cart.html">
<i class="fas fa-cart-shopping"></i>
</a>

</div>


<!-- MENU BUTTON -->

<div class="menu-toggle" id="menuToggle">

<i class="fas fa-bars"></i>

</div>

</div>

</header>



<!-- PROFILE SECTION -->

<div class="main-container">

<div class="profile-box">


<!-- PROFILE ICON -->

<div class="profile-icon">

<i class="fa-solid fa-user"></i>

</div>


<!-- USERNAME -->

<h1 id="username">

User

</h1>


<!-- EMAIL -->

<p class="profile-email"
id="email">

email@gmail.com

</p>


<!-- PHONE -->

<p class="profile-email"
id="phone">

+91 9876543210

</p>



<!-- INFO CARD -->

<div class="info-card">

<p>

<span>
Account Status :
</span>

Active

</p>

<p>

<span>
Login Method :
</span>

Email & Password

</p>

<p>

<span>
Store :
</span>

Patnala Furniture

</p>

</div>



<!-- MY ORDERS -->

<button
class="profile-btn orders-btn"
onclick="openOrders()">

<i class="fa-solid fa-box"></i>

My Orders

</button>



<!-- HOME -->

<button
class="profile-btn home-btn"
onclick="goHome()">

<i class="fa-solid fa-house"></i>

Back Home

</button>



<!-- LOGOUT -->

<button
class="profile-btn logout-btn"
onclick="logout()">

<i class="fa-solid fa-right-from-bracket"></i>

Logout

</button>


</div>

</div>



<script>

// =========================
// MOBILE MENU
// =========================

const menuToggle =
document.getElementById(
"menuToggle"
);

const navLinks =
document.getElementById(
"navLinks"
);

menuToggle.onclick = () => {

navLinks.classList.toggle(
"active"
);

};


// =========================
// GET USER DATA
// =========================

const username =
localStorage.getItem(
"username"
);

const email =
localStorage.getItem(
"userEmail"
);

const phone =
localStorage.getItem(
"userPhone"
);

const token =
localStorage.getItem(
"token"
);


// =========================
// LOGIN CHECK
// =========================

if(!token){

window.location.href =
"login.html";

}


// =========================
// SHOW USER DATA
// =========================

document.getElementById(
"username"
).innerText =
username || "User";

document.getElementById(
"email"
).innerText =
email || "No Email";

document.getElementById(
"phone"
).innerText =
phone || "No Phone";


// =========================
// GO HOME
// =========================

function goHome(){

window.location.href =
"index.html";

}


// =========================
// OPEN ORDERS
// =========================

function openOrders(){

window.location.href =
"myorders.html";

}


// =========================
// LOGOUT
// =========================

function logout(){

const confirmLogout =
confirm(
"Are you sure you want to logout?"
);

if(!confirmLogout) return;


// REMOVE STORAGE

localStorage.removeItem(
"token"
);

localStorage.removeItem(
"username"
);

localStorage.removeItem(
"userEmail"
);

localStorage.removeItem(
"userPhone"
);


// ALERT

alert(
"Logged Out Successfully"
);


// REDIRECT

window.location.href =
"login.html";

}

</script>

</body>

</html>
