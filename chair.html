<section class="cot-products-listing">

<div id="products"></div>

</section>







<script>

const API =
"https://furniturebackend-j767.onrender.com/api/products/category/Chair";

async function loadProducts(){

try{

const response =
await fetch(API);

const products =
await response.json();

const container =
document.getElementById(
"products"
);

container.innerHTML = "";

products.forEach((product,index)=>{

container.innerHTML += `

<div class="product-item
${index % 2 !== 0 ? "reverse" : ""}">

<div class="product-image-box"
data-aos="${
index % 2 !== 0
? "slide-right"
: "slide-left"
}">

<img
src="${
product.images?.[0]
|| "images/noimage.png"
}"
alt="${product.name}">

</div>


<div class="product-details"
data-aos="${
index % 2 !== 0
? "slide-left"
: "slide-right"
}">

<p class="product-category-small">

${product.category || "Luxury Collection"}

</p>

<h3>

${product.name}

</h3>

<p class="description">

${product.shortDescription
|| "Premium handcrafted furniture product."}

</p>

<p class="price-tag">

Starting from ₹
${product.sellingPrice || 0}

</p>

<a href="
https://wa.me/918555911417?text=
I'm interested in:
${product.name}
"

class="whatsapp-btn btn-filled"
target="_blank">

<i class="fab fa-whatsapp"></i>

Buy Now

</a>

</div>

</div>

`;

});

}
catch(error){

console.log(error);

}

}

loadProducts();

</script>
