<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="images/fav.png">
<title>All Orders - Patnala Furniture</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#f5f5f5;
padding:40px;
}

.page-title{
font-size:2.5rem;
margin-bottom:30px;
color:#222;
}

.orders-grid{
display:grid;
gap:25px;
}

.order-card{

background:#fff;

border-radius:25px;

padding:25px;

display:grid;

grid-template-columns:
180px 1fr;

gap:25px;

box-shadow:
0 10px 30px rgba(0,0,0,0.06);

}

.order-image img{

width:100%;

height:180px;

object-fit:cover;

border-radius:20px;

}

.order-details h2{

font-size:1.7rem;

margin-bottom:15px;

color:#222;
}

.order-info{

display:grid;

grid-template-columns:
repeat(2,1fr);

gap:15px;

margin-top:20px;
}

.info-box{

background:#fafafa;

padding:15px;

border-radius:15px;
}

.info-box span{

display:block;

font-size:0.9rem;

color:#777;

margin-bottom:6px;
}

.info-box h4{

font-size:1rem;

color:#222;
}

.price{

font-size:1.5rem;

font-weight:700;

color:#c99330;

margin-top:20px;
}

.status{

display:inline-block;

padding:10px 18px;

background:#c99330;

color:#fff;

border-radius:30px;

font-size:0.9rem;

margin-top:20px;
}

@media(max-width:900px){

.order-card{
grid-template-columns:1fr;
}

.order-info{
grid-template-columns:1fr;
}

}

</style>

</head>

<body>


<h1 class="page-title">

All Orders

</h1>


<div class="orders-grid"
id="ordersContainer">

</div>


<script>

const adminUser =
localStorage.getItem(
"adminUser"
);

if(adminUser !== "admin"){

window.location.href =
"admin.html";

}

</script>
<script>

const API =
"https://furniturebackend-j767.onrender.com/api/orders";


async function loadOrders(){

try{

const response =
await fetch(API);

const orders =
await response.json();

const container =
document.getElementById(
"ordersContainer"
);

container.innerHTML = "";


orders.forEach(order=>{

container.innerHTML += `

<div class="order-card">


<div class="order-image">

<img
src="${
order.productImage
|| 'images/noimage.png'
}"
>

</div>


<div class="order-details">

<h2>

${order.productName}

</h2>


<div class="order-info">

<div class="info-box">

<span>
Customer Name
</span>

<h4>
${order.customerName}
</h4>

</div>


<div class="info-box">

<span>
Phone
</span>

<h4>
${order.phone}
</h4>

</div>


<div class="info-box">

<span>
Address
</span>

<h4>

${order.address},

${order.city},

${order.state},

${order.pincode}

</h4>

</div>


<div class="info-box">

<span>
Payment
</span>

<h4>
${order.paymentMethod}
</h4>

</div>


<div class="info-box">

<span>
Quantity
</span>

<h4>
${order.quantity}
</h4>

</div>


<div class="info-box">

<span>
User
</span>

<h4>
${order.userName}
</h4>

</div>

</div>


<div class="price">

₹${order.totalPrice}

</div>


<div class="status">

${order.status}

</div>

</div>

</div>

`;

});

}
catch(error){

console.log(error);

}

}


loadOrders();

</script>

</body>

</html>
