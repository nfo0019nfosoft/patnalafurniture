<!-- =========================
CHECKOUT.HTML
========================= -->

<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="images/fav.png">
<title>Checkout - Patnala Furniture</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, Helvetica, sans-serif;
}

body{
background:#f5f5f5;
}


/* =========================
NAVBAR
========================= */

.navbar{
width:100%;
background:#fff;
padding:18px 6%;
display:flex;
align-items:center;
justify-content:space-between;
box-shadow:0 5px 20px rgba(0,0,0,0.05);
position:sticky;
top:0;
z-index:999;
}

.logo img{
width:170px;
}

.nav-links{
display:flex;
align-items:center;
gap:30px;
}

.nav-links a{
text-decoration:none;
color:#111;
font-weight:600;
transition:0.3s;
}

.nav-links a:hover{
color:#c99330;
}

.nav-icons{
display:flex;
align-items:center;
gap:22px;
}

.nav-icons a{
color:#111;
font-size:1.2rem;
transition:0.3s;
}

.nav-icons a:hover{
color:#c99330;
}


/* =========================
CHECKOUT SECTION
========================= */

.checkout-section{
padding:60px 6%;
}

.checkout-container{
max-width:1400px;
margin:auto;
display:grid;
grid-template-columns:1.2fr 0.8fr;
gap:35px;
}


/* =========================
FORM
========================= */

.checkout-form{
background:#fff;
padding:35px;
border-radius:25px;
box-shadow:0 10px 30px rgba(0,0,0,0.06);
}

.checkout-form h1{
font-size:2.5rem;
margin-bottom:30px;
color:#222;
}

.input-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
}

.input-box{
margin-bottom:22px;
}

.input-box label{
display:block;
margin-bottom:10px;
font-weight:600;
color:#222;
}

.input-box input,
.input-box textarea,
.input-box select{

width:100%;
padding:16px;
border:1px solid #ddd;
border-radius:14px;
outline:none;
font-size:1rem;
}

.input-box textarea{
height:120px;
resize:none;
}

.input-box input:focus,
.input-box textarea:focus,
.input-box select:focus{
border-color:#c99330;
}


/* =========================
ORDER SUMMARY
========================= */

.order-summary{
background:#fff;
padding:30px;
border-radius:25px;
box-shadow:0 10px 30px rgba(0,0,0,0.06);
height:fit-content;
position:sticky;
top:120px;
}

.order-summary h2{
font-size:2rem;
margin-bottom:25px;
color:#222;
}

.product-card{
display:flex;
gap:18px;
margin-bottom:25px;
padding-bottom:25px;
border-bottom:1px solid #eee;
}

.product-card img{
width:120px;
height:120px;
object-fit:cover;
border-radius:16px;
}

.product-details h3{
font-size:1.2rem;
margin-bottom:10px;
color:#222;
}

.product-details p{
color:#777;
margin-bottom:10px;
}

.price{
font-size:1.2rem;
font-weight:700;
color:#c99330;
}

.summary-row{
display:flex;
justify-content:space-between;
margin-bottom:18px;
font-size:1.1rem;
}

.total{
font-size:1.5rem;
font-weight:700;
color:#222;
margin-top:20px;
}


/* =========================
BUTTON
========================= */

.place-order-btn{
width:100%;
padding:18px;
border:none;
background:#c99330;
color:#fff;
font-size:1rem;
font-weight:700;
border-radius:14px;
cursor:pointer;
margin-top:30px;
transition:0.3s;
}

.place-order-btn:hover{
opacity:0.9;
transform:translateY(-2px);
}


/* =========================
MOBILE
========================= */

@media(max-width:991px){

.checkout-container{
grid-template-columns:1fr;
}

.order-summary{
position:static;
}

.input-grid{
grid-template-columns:1fr;
}

.nav-links{
display:none;
}

}

</style>

</head>

<body>


<!-- NAVBAR -->

<header class="navbar">

<div class="logo">

<a href="index.html">

<img src="images/logo.png">

</a>

</div>

<nav class="nav-links">

<a href="cot.html">COT</a>

<a href="sofa-sets.html">SOFA SETS</a>

<a href="diwan-cot.html">DIWAN COT</a>

<a href="chair.html">CHAIR</a>

<a href="accessories.html">ACCESSORIES</a>

<a href="marriage-kit.html">MARRIAGE KIT</a>

</nav>

<div class="nav-icons">

<a href="index.html">
<i class="fas fa-house"></i>
</a>

<a href="cart.html">
<i class="fas fa-cart-shopping"></i>
</a>

</div>

</header>



<!-- CHECKOUT SECTION -->

<section class="checkout-section">

<div class="checkout-container">


<!-- FORM -->

<div class="checkout-form">

<h1>

Checkout

</h1>


<div class="input-grid">

<div class="input-box">

<label>Full Name</label>

<input
type="text"
id="name"
placeholder="Enter Name"
>

</div>


<div class="input-box">

<label>Phone Number</label>

<input
type="text"
id="phone"
placeholder="Enter Phone"
>

</div>

</div>



<div class="input-box">

<label>Shipping Address</label>

<textarea
id="address"
placeholder="Enter Address">
</textarea>

</div>



<div class="input-grid">

<div class="input-box">

<label>City</label>

<input
type="text"
id="city"
placeholder="Enter City"
>

</div>


<div class="input-box">

<label>Pincode</label>

<input
type="text"
id="pincode"
placeholder="Enter Pincode"
>

</div>

</div>



<div class="input-box">

<label>Payment Method</label>

<select id="payment">

<option>
Cash On Delivery
</option>
<!-- 
<option>
UPI
</option>

<option>
Card
</option> -->

</select>

</div>


<button
class="place-order-btn"
onclick="placeOrder()">

Place Order

</button>

</div>



<!-- ORDER SUMMARY -->

<div class="order-summary">

<h2>

Order Summary

</h2>


<div id="orderItems">

</div>


<div class="summary-row">

<span>Total Items</span>

<span id="totalItems">

0

</span>

</div>


<div class="summary-row total">

<span>Total Price</span>

<span id="totalPrice">

₹0

</span>

</div>

</div>

</div>

</section>
<script>

const API =
"https://furniturebackend-j767.onrender.com/api/products";

const ORDER_API =
"https://furniturebackend-j767.onrender.com/api/orders";

// LOGIN CHECK

const email =
localStorage.getItem("email");

if(!email){

window.location.href =
"login.html";

}

const cartKey =
`cart_${email}`;


// USER CART



let cart =
JSON.parse(
localStorage.getItem(cartKey)
) || [];


// BUY NOW SUPPORT

const params =
new URLSearchParams(
window.location.search
);

const buyNowId =
params.get("id");

if(buyNowId){

cart = [
{
id:buyNowId,
qty:1
}
];

}


// LOAD ORDER SUMMARY

async function loadOrder(){

const container =
document.getElementById(
"orderItems"
);

container.innerHTML = "";

let totalPrice = 0;

let totalItems = 0;


if(cart.length === 0){

container.innerHTML = `

<h3 style="
text-align:center;
color:#777;
padding:20px;
">

No Products Found

</h3>

`;

document.getElementById(
"totalItems"
).innerText = "0";

document.getElementById(
"totalPrice"
).innerText = "₹0";

return;

}


for(const item of cart){

try{

const response =
await fetch(
`${API}/${item.id}`
);

const product =
await response.json();

if(!product || !product._id){

continue;

}

const subtotal =
product.sellingPrice * item.qty;

totalPrice += subtotal;

totalItems += item.qty;


container.innerHTML += `

<div class="product-card">

<img
src="${
product.images?.[0]
|| "images/noimage.png"
}"
>

<div class="product-details">

<h3>
${product.name}
</h3>

<p>
Quantity : ${item.qty}
</p>

<div class="price">
₹${subtotal}
</div>

</div>

</div>

`;

}
catch(error){

console.log(
"Product Load Error",
error
);

}

}


document.getElementById(
"totalItems"
).innerText =
totalItems;

document.getElementById(
"totalPrice"
).innerText =
`₹${totalPrice}`;

}



// PLACE ORDER

async function placeOrder(){

const name =
document.getElementById("name").value.trim();

const phone =
document.getElementById("phone").value.trim();

const address =
document.getElementById("address").value.trim();

const city =
document.getElementById("city").value.trim();

const pincode =
document.getElementById("pincode").value.trim();

const payment =
document.getElementById("payment").value;


// VALIDATION

if(name === ""){
alert("Enter Full Name");
return;
}

if(phone === ""){
alert("Enter Phone Number");
return;
}

if(phone.length !== 10){
alert("Phone Number Must Be 10 Digits");
return;
}

if(isNaN(phone)){
alert("Invalid Phone Number");
return;
}

if(address === ""){
alert("Enter Shipping Address");
return;
}

if(city === ""){
alert("Enter City");
return;
}

if(pincode === ""){
alert("Enter Pincode");
return;
}

if(pincode.length !== 6){
alert("Pincode Must Be 6 Digits");
return;
}

if(isNaN(pincode)){
alert("Invalid Pincode");
return;
}

if(cart.length === 0){
alert("Cart Is Empty");
return;
}


// GET PRODUCT DETAILS

try{

const productResponse =
await fetch(
`${API}/${cart[0].id}`
);

const product =
await productResponse.json();

const totalPrice =
product.sellingPrice * cart[0].qty;


// ORDER DATA

const orderData = {

email,

customerName:name,

phone,

address,

city,

pincode,

paymentMethod:payment,

quantity:cart[0].qty,

productName:product.name,

productImage:
product.images?.[0]
|| "images/noimage.png",

totalPrice,

status:"Pending"

};



// SAVE ORDER

const response =
await fetch(ORDER_API,{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify(orderData)

});

const data =
await response.json();


// SUCCESS
alert(
"Order Placed Successfully"
);

localStorage.removeItem(
cartKey
);

window.location.href =
"myorders.html";




}
catch(error){

console.log(error);

alert(
"Something Went Wrong"
);

}

}


// INITIAL LOAD

loadOrder();

</script>

</body>

</html>
