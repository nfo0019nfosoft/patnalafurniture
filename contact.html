<section class="teak-contact-section">
<div class="teak-contact-container">
<!-- LEFT FORM -->
<div class="teak-contact-form" data-aos="slide-right">
<h2>Send Us a Message</h2>
<form class="contact-form" id="contact_form">
<div class="form-group">
<label>Your Name</label>
<input type="text" name="name" required placeholder="John Doe">
</div>
<div class="form-group">
<label>Email Address</label>
<input type="email" name="email" required placeholder="john.doe@example.com">
</div>
<div class="form-group">
<label>Phone Number</label>
<input type="tel" name="phone" placeholder="+91 98765 43210">
</div>
<!-- NEW CATEGORY FIELD -->
<div class="form-group">
<label>Select Category</label>
<select name="category" required>
<option value="" disabled selected>Choose a category</option>
<option value="Cot">Cot</option>
<option value="Sofa Sets">Sofa Sets</option>
<option value="Diwan Cot">Diwan Cot</option>
<option value="Chair">Chair</option>
<option value="Wooden Accessories">Wooden Accessories</option>
<option value="Marriage Kit">Marriage Kit</option>
<option value="Custom Design">Custom Design</option>
<option value="Others">Others</option>
</select>
</div>
<div class="form-group">
<label>Your Message</label>
<textarea name="message" rows="5" required placeholder="I am interested in a custom cot design..."></textarea>
</div>
<button type="submit" class="teak-btn">Send Inquiry</button>
</form>
</div>


<!-- RIGHT SIDE INFO -->
<div class="teak-contact-info" data-aos="slide-left">
<h2>Reach Out Directly</h2>
<div class="teak-contact-cards">
<!-- Phone -->
<div class="teak-contact-card single">
<i class="fas fa-phone"></i>
<p class="label">Phone Number:</p>
<p><a href="tel:+918555911417">+91 8555911417</a></p>
</div>
<!-- Email -->
<div class="teak-contact-card single">
<i class="fas fa-envelope"></i>
<p class="label">Email Address:</p>
<p><a href="mailto:patnala.furniture@gmail.com">patnala.furniture@gmail.com</a></p>
</div>
<!-- Address -->
<div class="teak-contact-card single">
<i class="fas fa-map-marker-alt
"></i>
<p class="label">Address:</p>
<p>Patnala Furniture, India</p>
</div>
</div>
<!-- WhatsApp Button -->
<a href="https://wa.me/918555911417?text=Hi,%20I%20would%20like%20to%20know%20more%20about%20your%20furniture."
target="_blank"
class="teak-whatsapp-btn">
<i class="fab fa-whatsapp"></i> WhatsApp: Chat with us
</a>
</div>
</div>
</section>
