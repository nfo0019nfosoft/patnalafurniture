<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Shopping Cart</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#f5f5f5;
padding:40px;
}

.cart-container{
max-width:1200px;
margin:auto;
}

.cart-title{
font-size:2.5rem;
margin-bottom:30px;
color:#222;
}

.cart-grid{
display:grid;
grid-template-columns:2fr 1fr;
gap:30px;
}

.cart-items{
background:#fff;
padding:25px;
border-radius:20px;
}

.cart-item{
display:flex;
gap:20px;
align-items:center;
padding:20px 0;
border-bottom:1px solid #eee;
}

.cart-item img{
width:130px;
height:130px;
object-fit:cover;
border-radius:15px;
}

.item-details{
flex:1;
}

.item-details h3{
font-size:1.3rem;
margin-bottom:10px;
}

.item-details p{
color:#777;
margin-bottom:10px;
}

.price{
font-size:1.2rem;
font-weight:700;
color:#c99330;
}

.qty-box{
display:flex;
align-items:center;
gap:10px;
margin-top:15px;
}

.qty-btn{
width:35px;
height:35px;
border:none;
background:#c99330;
color:#fff;
border-radius:8px;
cursor:pointer;
}

.remove-btn{
background:red;
color:#fff;
border:none;
padding:10px 15px;
border-radius:10px;
cursor:pointer;
margin-top:15px;
}

.summary{
background:#fff;
padding:25px;
border-radius:20px;
height:fit-content;
}

.summary h2{
margin-bottom:20px;
}

.summary-row{
display:flex;
justify-content:space-between;
margin-bottom:15px;
}

.checkout-btn{
width:100%;
padding:15px;
border:none;
background:#c99330;
color:#fff;
font-size:1rem;
font-weight:700;
border-radius:12px;
cursor:pointer;
margin-top:20px;
}

.empty-cart{
text-align:center;
padding:80px;
font-size:1.3rem;
color:#777;
}

@media(max-width:900px){

.cart-grid{
grid-template-columns:1fr;
}

.cart-item{
flex-direction:column;
align-items:flex-start;
}

.cart-item img{
width:100%;
height:250px;
}

}

</style>

</head>

<body>

<div class="cart-container">

<h1 class="cart-title">
Shopping Cart
</h1>

<div class="cart-grid">

<div class="cart-items"
id="cartItems">

</div>

<div class="summary">

<h2>Order Summary</h2>

<div class="summary-row">
<span>Total Items</span>
<span id="totalItems">
0
</span>
</div>

<div class="summary-row">
<span>Total Price</span>
<span id="totalPrice">
₹0
</span>
</div>

<button class="checkout-btn">

Proceed To Checkout

</button>

</div>

</div>

</div>



<script>

const API =
"https://furniturebackend-j767.onrender.com/api/products";

let cart =
JSON.parse(
localStorage.getItem("cart")
) || [];

async function loadCart(){

const container =
document.getElementById(
"cartItems"
);

if(cart.length === 0){

container.innerHTML = `

<div class="empty-cart">

<i class="fas fa-cart-shopping"></i>

<p>
Your cart is empty
</p>

</div>

`;

return;

}

container.innerHTML = "";

let totalPrice = 0;

let totalItems = 0;

for(let item of cart){

const response =
await fetch(
`${API}/${item.id}`
);

const product =
await response.json();

const subtotal =
product.sellingPrice * item.qty;

totalPrice += subtotal;

totalItems += item.qty;

container.innerHTML += `

<div class="cart-item">

<img
src="${
product.images?.[0]
|| "images/noimage.png"
}"
>

<div class="item-details">

<h3>
${product.name}
</h3>

<p>
${product.brand || ""}
</p>

<div class="price">

₹${product.sellingPrice}

</div>

<div class="qty-box">

<button
class="qty-btn"
onclick="changeQty('${item.id}',-1)">

-

</button>

<span>
${item.qty}
</span>

<button
class="qty-btn"
onclick="changeQty('${item.id}',1)">

+

</button>

</div>

<button
class="remove-btn"
onclick="removeItem('${item.id}')">

Remove

</button>

</div>

</div>

`;

}

document.getElementById(
"totalPrice"
).innerText =
`₹${totalPrice}`;

document.getElementById(
"totalItems"
).innerText =
totalItems;

}


function changeQty(id,value){

cart = cart.map(item=>{

if(item.id === id){

item.qty += value;

if(item.qty < 1){

item.qty = 1;

}

}

return item;

});

localStorage.setItem(
"cart",
JSON.stringify(cart)
);

loadCart();

}


function removeItem(id){

cart =
cart.filter(
item=>item.id !== id
);

localStorage.setItem(
"cart",
JSON.stringify(cart)
);

loadCart();

}


loadCart();

</script>

</body>

</html>
