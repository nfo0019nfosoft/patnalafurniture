<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Shopping Cart</title>
  <link rel="icon" type="image/png" href="images/fav.png">
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, Helvetica, sans-serif;
}

body{
background:#f5f5f5;
}


/* =========================
NAVBAR
========================= */

.navbar{
width:100%;
background:#fff;
padding:18px 6%;
display:flex;
align-items:center;
justify-content:space-between;
box-shadow:0 5px 20px rgba(0,0,0,0.05);
position:sticky;
top:0;
z-index:999;
}

.logo img{
width:170px;
}

.nav-links{
display:flex;
align-items:center;
gap:30px;
}

.nav-links a{
text-decoration:none;
color:#111;
font-weight:600;
transition:0.3s;
}

.nav-links a:hover{
color:#c99330;
}

.nav-icons{
display:flex;
align-items:center;
gap:22px;
}

.nav-icons a{
color:#111;
font-size:1.2rem;
transition:0.3s;
}

.nav-icons a:hover{
color:#c99330;
}


/* =========================
CART SECTION
========================= */

.cart-section{
padding:60px 6%;
}

.cart-container{
max-width:1400px;
margin:auto;
}

.cart-title{
font-size:2.7rem;
margin-bottom:35px;
color:#222;
}

.cart-grid{
display:grid;
grid-template-columns:2fr 1fr;
gap:35px;
}


/* =========================
CART ITEMS
========================= */

.cart-items{
background:#fff;
padding:30px;
border-radius:25px;
box-shadow:0 10px 30px rgba(0,0,0,0.06);
}

.cart-item{
display:flex;
gap:25px;
padding:25px 0;
border-bottom:1px solid #eee;
}

.cart-item:last-child{
border-bottom:none;
}

.cart-item img{
width:160px;
height:160px;
object-fit:cover;
border-radius:18px;
}

.item-details{
flex:1;
}

.item-details h3{
font-size:1.5rem;
margin-bottom:10px;
color:#222;
}

.item-details p{
color:#777;
margin-bottom:12px;
}

.price{
font-size:1.3rem;
font-weight:700;
color:#c99330;
margin-bottom:15px;
}


/* =========================
QUANTITY
========================= */

.qty-box{
display:flex;
align-items:center;
gap:12px;
margin-bottom:18px;
}

.qty-btn{
width:38px;
height:38px;
border:none;
background:#c99330;
color:#fff;
font-size:1rem;
border-radius:10px;
cursor:pointer;
transition:0.3s;
}

.qty-btn:hover{
opacity:0.9;
}

.qty-number{
font-size:1.1rem;
font-weight:700;
}


/* =========================
REMOVE BUTTON
========================= */

.remove-btn{
padding:12px 20px;
border:none;
background:#d62828;
color:#fff;
border-radius:12px;
cursor:pointer;
font-weight:600;
transition:0.3s;
}

.remove-btn:hover{
opacity:0.9;
}


/* =========================
SUMMARY
========================= */

.summary{
background:#fff;
padding:30px;
border-radius:25px;
box-shadow:0 10px 30px rgba(0,0,0,0.06);
height:fit-content;
position:sticky;
top:120px;
}

.summary h2{
font-size:2rem;
margin-bottom:25px;
color:#222;
}

.summary-row{
display:flex;
justify-content:space-between;
margin-bottom:18px;
font-size:1.1rem;
}

.total{
font-size:1.4rem;
font-weight:700;
color:#222;
margin-top:20px;
}


/* =========================
CHECKOUT BUTTON
========================= */

.checkout-btn{
width:100%;
padding:16px;
border:none;
background:#c99330;
color:#fff;
font-size:1rem;
font-weight:700;
border-radius:14px;
cursor:pointer;
margin-top:30px;
transition:0.3s;
}

.checkout-btn:hover{
opacity:0.9;
transform:translateY(-2px);
}


/* =========================
EMPTY CART
========================= */

.empty-cart{
text-align:center;
padding:90px 20px;
}

.empty-cart i{
font-size:5rem;
color:#c99330;
margin-bottom:20px;
}

.empty-cart p{
font-size:1.4rem;
color:#777;
}


/* =========================
MOBILE
========================= */

@media(max-width:991px){

.cart-grid{
grid-template-columns:1fr;
}

.summary{
position:static;
}

.cart-item{
flex-direction:column;
}

.cart-item img{
width:100%;
height:280px;
}

.nav-links{
display:none;
}

}

</style>

</head>

<body>


<!-- NAVBAR -->

<header class="navbar">

<div class="logo">

<a href="index.html">

<img src="images/logo.png">

</a>

</div>

<nav class="nav-links">

<a href="cot.html">COT</a>

<a href="sofa-sets.html">SOFA SETS</a>

<a href="diwan-cot.html">DIWAN COT</a>

<a href="chair.html">CHAIR</a>

<a href="accessories.html">ACCESSORIES</a>

<a href="marriage-kit.html">MARRIAGE KIT</a>

</nav>

<div class="nav-icons">

<a href="index.html">
<i class="fas fa-house"></i>
</a>

<a href="cart.html">
<i class="fas fa-cart-shopping"></i>
</a>

</div>

</header>



<!-- CART SECTION -->

<section class="cart-section">

<div class="cart-container">

<h1 class="cart-title">

Shopping Cart

</h1>


<div class="cart-grid">


<!-- CART ITEMS -->

<div class="cart-items"
id="cartItems">

</div>


<!-- SUMMARY -->

<div class="summary">

<h2>

Order Summary

</h2>

<div class="summary-row">

<span>Total Items</span>

<span id="totalItems">

0

</span>

</div>

<div class="summary-row total">

<span>Total Price</span>

<span id="totalPrice">

₹0

</span>

</div>

<button 
class="checkout-btn"
onclick="goToCheckout()">

Proceed To Checkout

</button>

</div>

</div>

</div>

</section>



<script>

const API =
"https://furniturebackend-j767.onrender.com/api/products";


// =========================
// USER WISE CART
// =========================

const userEmail =
localStorage.getItem(
"userEmail"
);


// LOGIN CHECK

if(!userEmail){

window.location.href =
"login.html";

}


// USER CART KEY

const cartKey =
`cart_${userEmail}`;


// GET CART

let cart =
JSON.parse(
localStorage.getItem(cartKey)
) || [];



// =========================
// REMOVE DUPLICATE PRODUCTS
// =========================

cart = cart.reduce((acc,item)=>{

const existing =
acc.find(
x => String(x.id) === String(item.id)
);

if(existing){

existing.qty += item.qty || 1;

}
else{

acc.push({

id:String(item.id),

qty:item.qty || 1

});

}

return acc;

},[]);


// SAVE CLEAN CART

localStorage.setItem(

cartKey,

JSON.stringify(cart)

);




// =========================
// LOAD CART
// =========================

async function loadCart(){

const container =
document.getElementById(
"cartItems"
);


// EMPTY CART

if(cart.length === 0){

container.innerHTML = `

<div class="empty-cart">

<i class="fas fa-cart-shopping"></i>

<p>

Your cart is empty

</p>

</div>

`;

document.getElementById(
"totalPrice"
).innerText = "₹0";

document.getElementById(
"totalItems"
).innerText = "0";

return;

}


// CLEAR CONTAINER

container.innerHTML = "";

let totalPrice = 0;

let totalItems = 0;


// LOOP CART ITEMS

for(let item of cart){

try{

const response =
await fetch(
`${API}/${item.id}`
);

const product =
await response.json();


// PRODUCT NOT FOUND

if(!product || !product._id){

continue;

}


// SUBTOTAL

const subtotal =
product.sellingPrice * item.qty;


// TOTALS

totalPrice += subtotal;

totalItems += item.qty;


// HTML

container.innerHTML += `

<div class="cart-item">

<img
src="${
product.images?.[0]
|| "images/noimage.png"
}"
alt="${product.name}"
>

<div class="item-details">

<h3>

${product.name}

</h3>

<p>

${product.brand || "Luxury Furniture"}

</p>

<div class="price">

₹${product.sellingPrice}

</div>


<!-- QUANTITY -->

<div class="qty-box">

<button
type="button"
class="qty-btn"
onclick="changeQty('${item.id}',-1)">

-

</button>

<span class="qty-number">

${item.qty}

</span>

<button
type="button"
class="qty-btn"
onclick="changeQty('${item.id}',1)">

+

</button>

</div>


<!-- REMOVE -->

<button
type="button"
class="remove-btn"
onclick="removeItem('${item.id}')">

Remove

</button>

</div>

</div>

`;

}
catch(error){

console.log(
"Product Load Error",
error
);

}

}


// SHOW TOTALS

document.getElementById(
"totalPrice"
).innerText =
`₹${totalPrice}`;

document.getElementById(
"totalItems"
).innerText =
totalItems;

}




// =========================
// CHANGE QUANTITY
// =========================

function changeQty(id,value){

cart = cart.map(item=>{

if(String(item.id) === String(id)){

item.qty += value;


// MINIMUM 1

if(item.qty < 1){

item.qty = 1;

}

}

return item;

});


// SAVE UPDATED CART

localStorage.setItem(

cartKey,

JSON.stringify(cart)

);


// RELOAD CART

loadCart();

}




// =========================
// REMOVE ITEM
// =========================

function removeItem(id){

cart =
cart.filter(
item => String(item.id) !== String(id)
);


// SAVE UPDATED CART

localStorage.setItem(

cartKey,

JSON.stringify(cart)

);


// RELOAD

loadCart();

}




// =========================
// GO TO CHECKOUT
// =========================

function goToCheckout(){

if(cart.length === 0){

alert(
"Cart Is Empty"
);

return;

}

window.location.href =
"checkout.html";

}




// =========================
// INITIAL LOAD
// =========================

loadCart();

</script>
</body>

</html>
