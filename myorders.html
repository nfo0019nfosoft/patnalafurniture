<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>My Orders</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

background:
linear-gradient(
135deg,
#2b1408,
#874526,
#c99330
);

min-height:100vh;

padding:40px 20px;
}


/* PAGE TITLE */

.page-title{

text-align:center;

font-size:3rem;

font-weight:700;

color:#fff;

margin-bottom:50px;
}


/* ORDERS */

.orders-container{

max-width:1400px;

margin:auto;

display:grid;

gap:30px;
}


/* ORDER CARD */

.order-card{

background:
rgba(255,255,255,0.12);

backdrop-filter:blur(18px);

border:1px solid
rgba(255,255,255,0.15);

border-radius:30px;

padding:25px;

display:grid;

grid-template-columns:
300px 1fr;

gap:30px;

box-shadow:
0 15px 40px rgba(0,0,0,0.25);

color:#fff;

transition:0.3s;
}

.order-card:hover{

transform:translateY(-5px);
}


/* IMAGE */

.order-image img{

width:100%;

height:280px;

object-fit:cover;

border-radius:25px;
}


/* DETAILS */

.order-details h2{

font-size:2rem;

margin-bottom:10px;
}

.brand{

color:#ffd27a;

margin-bottom:18px;

font-size:1rem;
}

.description{

line-height:1.8;

margin-bottom:25px;

color:#eee;
}


/* INFO GRID */

.info-grid{

display:grid;

grid-template-columns:
repeat(2,1fr);

gap:18px;

margin-bottom:25px;
}

.info-box{

background:
rgba(255,255,255,0.08);

padding:18px;

border-radius:18px;
}

.info-box span{

display:block;

font-size:0.85rem;

margin-bottom:6px;

color:#ddd;
}

.info-box h4{

font-size:1rem;

font-weight:600;
}


/* TOTAL */

.total-price{

font-size:2rem;

font-weight:700;

color:#ffd27a;

margin-bottom:20px;
}


/* STATUS */

.status{

display:inline-block;

padding:12px 22px;

border-radius:30px;

font-size:0.9rem;

font-weight:600;

background:
linear-gradient(
90deg,
#874526,
#c99330
);

}


/* EMPTY */

.empty-orders{

text-align:center;

padding:120px 20px;

color:#fff;
}

.empty-orders i{

font-size:5rem;

margin-bottom:25px;

color:#ffd27a;
}

.empty-orders h2{

font-size:2rem;

margin-bottom:15px;
}


/* MOBILE */

@media(max-width:991px){

.order-card{

grid-template-columns:1fr;

}

.info-grid{

grid-template-columns:1fr;
}

.page-title{

font-size:2.3rem;
}

}


@media(max-width:600px){

.order-image img{

height:220px;
}

.order-details h2{

font-size:1.6rem;
}

.total-price{

font-size:1.6rem;
}

}

</style>

</head>

<body>



<h1 class="page-title">

My Orders

</h1>



<div class="orders-container"
id="ordersContainer">

</div>





<script>

const API =
"https://furniturebackend-j767.onrender.com/api/orders";

const username =
localStorage.getItem(
"username"
);

const token =
localStorage.getItem(
"token"
);


// LOGIN CHECK

if(!token){

window.location.href =
"login.html";

}


// LOAD ORDERS

async function loadOrders(){

try{

const response =
await fetch(API);

const orders =
await response.json();


// FILTER USER ORDERS

const myOrders =
orders.filter(order =>

order.userName === username

);


const container =
document.getElementById(
"ordersContainer"
);


// EMPTY

if(myOrders.length === 0){

container.innerHTML = `

<div class="empty-orders">

<i class="fa-solid fa-box-open"></i>

<h2>

No Orders Yet

</h2>

<p>

Your ordered products will appear here

</p>

</div>

`;

return;

}


// SHOW ORDERS

container.innerHTML = "";

myOrders.forEach(order=>{

container.innerHTML += `

<div class="order-card">


<div class="order-image">

<img
src="${
order.productImage
|| "images/noimage.png"
}"
>

</div>



<div class="order-details">

<h2>

${order.productName}

</h2>


<p class="brand">

${order.paymentMethod}

</p>


<p class="description">

Shipping Address:

${order.address},

${order.city},

${order.state},

${order.pincode}

</p>



<div class="info-grid">


<div class="info-box">

<span>

Customer Name

</span>

<h4>

${order.customerName}

</h4>

</div>



<div class="info-box">

<span>

Phone Number

</span>

<h4>

${order.phone}

</h4>

</div>



<div class="info-box">

<span>

Quantity

</span>

<h4>

${order.quantity}

</h4>

</div>



<div class="info-box">

<span>

Payment Method

</span>

<h4>

${order.paymentMethod}

</h4>

</div>


</div>



<div class="total-price">

₹${order.totalPrice}

</div>



<div class="status">

${order.status || "Pending"}

</div>


</div>

</div>

`;

});

}
catch(error){

console.log(error);

alert(
"Failed To Load Orders"
);

}

}


loadOrders();

</script>

</body>

</html>
