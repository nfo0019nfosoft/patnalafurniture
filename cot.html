<script>

const API =
"https://furniturebackend-j767.onrender.com/api/products/category/cot";

// =========================
// USER CHECK
// =========================

const email =
localStorage.getItem(
"userEmail"
);

const token =
localStorage.getItem(
"token"
);

const cartKey =
`cart_${email}`;


// =========================
// LOAD PRODUCTS
// =========================

async function loadProducts(){

const container =
document.getElementById(
"products"
);

/* LOADER */

container.innerHTML = `

<div class="products-loader">

<div class="loader-card"></div>

<div class="loader-card"></div>

<div class="loader-card"></div>

</div>

`;

try{

const response =
await fetch(API);

const products =
await response.json();

/* CLEAR */

container.innerHTML = "";

/* NO PRODUCTS */

if(!products.length){

container.innerHTML = `

<div class="no-products">

<h2>
No Products Found
</h2>

<p>
Products will be added soon.
</p>

</div>

`;

return;

}

/* PRODUCTS */

products.forEach((product,index)=>{

container.innerHTML += `

<div class="product-item
${index % 2 !== 0 ? "reverse" : ""}">

<!-- IMAGE -->

<div class="product-image-box"
data-aos="${
index % 2 !== 0
? "slide-right"
: "slide-left"
}">

<img
src="${
product.images?.[0]
|| "images/noimage.png"
}"
alt="${product.name}">

</div>

<!-- DETAILS -->

<div class="product-details"
data-aos="${
index % 2 !== 0
? "slide-left"
: "slide-right"
}">

<p class="product-category-small">

${product.brand || "Luxury Collection"}

</p>

<h3>

${product.name}

</h3>

<div class="description">

${product.description
|| "Premium handcrafted furniture product."}

</div>

<p class="price-tag">

Starting from ₹
${product.sellingPrice || 0}

</p>

<!-- BUTTONS -->

<div class="product-buttons">

<button
type="button"
class="whatsapp-btn btn-filled"
onclick="buyNow('${product._id}')">

<i class="fas fa-bolt"></i>

Buy Now

</button>

<button
type="button"
class="whatsapp-btn btn-filled add-cart-btn"
onclick="addToCart('${product._id}')">

<i class="fas fa-cart-plus"></i>

Add To Cart

</button>

</div>

</div>

</div>

`;

});

}
catch(error){

console.log(error);

/* ERROR */

container.innerHTML = `

<div class="no-products">

<h2>
Failed To Load Products
</h2>

<p>
Please try again later.
</p>

</div>

`;

}

}


// =========================
// ADD TO CART
// =========================
function addToCart(id){

if(!token){

window.location.href =
"login.html";

return;

}

let cart =
JSON.parse(
localStorage.getItem(cartKey)
) || [];

const existing =
cart.find(
item => item.id === id
);

if(existing){

existing.qty += 1;

}
else{

cart.push({

id:id,

qty:1

});

}

localStorage.setItem(

cartKey,

JSON.stringify(cart)

);

alert(
"Added To Cart"
);

}



// =========================
// BUY NOW
// =========================

function buyNow(id){

if(!token){

window.location.href =
"login.html";

return;

}

window.location.href =
`checkout.html?id=${id}`;

}


// =========================
// INITIAL LOAD
// =========================

loadProducts();

</script>
