<!-- =========================
LOGIN.HTML
========================= -->

<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Patnala Furniture - Login</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

background:
linear-gradient(
135deg,
#2b1408,
#874526,
#c99330
);

overflow:hidden;

padding:20px;

position:relative;
}


/* BACKGROUND CIRCLES */

body::before,
body::after{

content:"";

position:absolute;

border-radius:50%;

filter:blur(80px);

opacity:0.4;

}

body::before{

width:350px;
height:350px;

background:#c99330;

top:-100px;
left:-100px;

}

body::after{

width:300px;
height:300px;

background:#fff;

bottom:-100px;
right:-100px;

}


/* LOGIN BOX */

.auth-container{

width:100%;
max-width:460px;

position:relative;

z-index:10;

}

.auth-box{

background:
rgba(255,255,255,0.12);

backdrop-filter:blur(18px);

border:1px solid
rgba(255,255,255,0.15);

padding:45px;

border-radius:35px;

box-shadow:
0 15px 50px rgba(0,0,0,0.25);

color:#fff;

animation:fadeIn 1s ease;
}


@keyframes fadeIn{

from{
opacity:0;
transform:translateY(30px);
}

to{
opacity:1;
transform:translateY(0);
}

}


/* LOGO */

.logo{

display:flex;

justify-content:center;

margin-bottom:25px;
}

.logo img{

width:90px;
}


/* TITLE */

.auth-box h1{

font-size:2.6rem;

font-weight:700;

text-align:center;

margin-bottom:10px;
}

.auth-box p{

text-align:center;

font-size:0.95rem;

color:
rgba(255,255,255,0.8);

margin-bottom:35px;
}


/* INPUT */

.input-box{

margin-bottom:22px;

position:relative;
}

.input-box label{

display:block;

margin-bottom:10px;

font-weight:500;

font-size:0.95rem;
}

.input-box i{

position:absolute;

top:48px;
left:16px;

color:#c99330;

font-size:1rem;
}

.input-box input{

width:100%;

padding:15px 15px 15px 48px;

border:none;

outline:none;

border-radius:14px;

background:
rgba(255,255,255,0.12);

color:#fff;

font-size:1rem;

border:1px solid
rgba(255,255,255,0.15);

transition:0.3s;
}

.input-box input::placeholder{
color:#ddd;
}

.input-box input:focus{

border-color:#c99330;

background:
rgba(255,255,255,0.18);
}


/* LOGIN BUTTON */

.login-btn{

width:100%;

padding:16px;

border:none;

border-radius:14px;

background:
linear-gradient(
90deg,
#874526,
#c99330
);

color:#fff;

font-size:1rem;

font-weight:600;

cursor:pointer;

transition:0.3s;

margin-top:10px;

display:flex;

align-items:center;

justify-content:center;

gap:10px;
}

.login-btn:hover{

transform:translateY(-2px);

box-shadow:
0 10px 25px rgba(0,0,0,0.2);
}


/* EXTRA */

.extra-links{

display:flex;

justify-content:space-between;

margin-top:18px;

font-size:0.9rem;
}

.extra-links a{

color:#fff;

text-decoration:none;

transition:0.3s;
}

.extra-links a:hover{

color:#ffd27a;
}


/* REGISTER */

.bottom-text{

text-align:center;

margin-top:30px;

font-size:0.95rem;

color:#eee;
}

.bottom-text a{

color:#ffd27a;

font-weight:600;

text-decoration:none;
}


/* MOBILE */

@media(max-width:500px){

.auth-box{

padding:35px 25px;

border-radius:25px;
}

.auth-box h1{
font-size:2rem;
}

}

</style>

</head>

<body>


<div class="auth-container">


<div class="auth-box">


<div class="logo">

<img src="images/logo.png">

</div>


<h1>

Welcome Back

</h1>

<p>

Login to continue your luxury furniture shopping

</p>



<div class="input-box">

<label>

Email Address

</label>

<i class="fa-solid fa-envelope"></i>

<input
type="email"
id="email"
placeholder="Enter your email"
>

</div>



<div class="input-box">

<label>

Password

</label>

<i class="fa-solid fa-lock"></i>

<input
type="password"
id="password"
placeholder="Enter your password"
>

</div>



<button
class="login-btn"
onclick="login()">

<i class="fa-solid fa-right-to-bracket"></i>

Login Account

</button>



<div class="extra-links">

<a href="forgot-password.html">

Forgot Password?

</a>

<a href="index.html">

Back Home

</a>

</div>



<div class="bottom-text">

Don't have an account?

<a href="register.html">

Create Account

</a>

</div>


</div>

</div>





<script>

const API =
"https://furniturebackend-j767.onrender.com/api/auth/login";


// =========================
// LOGIN
// =========================

async function login(){

try{

const email =
document.getElementById(
"email"
).value;

const password =
document.getElementById(
"password"
).value;


// VALIDATION

if(!email || !password){

alert(
"Please fill all fields"
);

return;

}


// API CALL

const response =
await fetch(API,{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

email,
password

})

});



const data =
await response.json();


// SUCCESS
if(data.success){

localStorage.setItem(
"token",
data.token
);

localStorage.setItem(
"username",
data.username
);

localStorage.setItem(
"email",
data.email
);


// USER WELCOME

alert(
`Welcome ${data.username}`
);


// REDIRECT

window.location.href =
"index.html";

}
else{

alert(
data.message
);

}

}
catch(error){

console.log(error);

alert(
"Something Went Wrong"
);

}

}

</script>

</body>

</html>
