<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Login</title>

<link rel="icon"
type="image/png"
href="images/fav.png">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

background:linear-gradient(
135deg,
#2b1408,
#874526,
#c99330
);

padding:20px;

}

.auth-container{

width:100%;
max-width:450px;

}

.auth-box{

background:rgba(255,255,255,0.12);

backdrop-filter:blur(18px);

padding:40px;

border-radius:30px;

box-shadow:0 15px 40px rgba(0,0,0,0.3);

color:#fff;

}

.auth-box h1{

text-align:center;

margin-bottom:10px;

font-size:2.5rem;

}

.auth-box p{

text-align:center;

margin-bottom:30px;

color:#eee;

}

.input-box{

margin-bottom:20px;

position:relative;

}

.input-box label{

display:block;

margin-bottom:8px;

font-size:0.95rem;

}

.input-box i{

position:absolute;

top:45px;

left:15px;

color:#c99330;

}

.input-box input{

width:100%;

padding:14px 14px 14px 45px;

border:none;

outline:none;

border-radius:12px;

background:rgba(255,255,255,0.12);

color:#fff;

font-size:1rem;

border:1px solid rgba(255,255,255,0.15);

}

.input-box input::placeholder{

color:#ddd;

}

.login-btn{

width:100%;

padding:15px;

border:none;

border-radius:12px;

background:linear-gradient(
90deg,
#874526,
#c99330
);

color:#fff;

font-size:1rem;

font-weight:600;

cursor:pointer;

margin-top:10px;

transition:0.3s;

}

.login-btn:hover{

transform:translateY(-2px);

}

.extra-links{

display:flex;

justify-content:space-between;

margin-top:20px;

}

.extra-links a{

color:#fff;

text-decoration:none;

font-size:0.9rem;

}

.extra-links a:hover{

color:#ffd27a;

}

</style>

</head>

<body>

<div class="auth-container">

<div class="auth-box">

<h1>Login</h1>

<p>Login To Continue Shopping</p>


<!-- EMAIL -->

<div class="input-box">

<label>Email</label>

<i class="fa-solid fa-envelope"></i>

<input
type="email"
id="email"
placeholder="Enter Email">

</div>


<!-- PASSWORD -->

<div class="input-box">

<label>Password</label>

<i class="fa-solid fa-lock"></i>

<input
type="password"
id="password"
placeholder="Enter Password">

</div>


<!-- LOGIN BUTTON -->

<button
class="login-btn"
onclick="loginUser()">

<i class="fa-solid fa-right-to-bracket"></i>

Login

</button>


<!-- LINKS -->

<div class="extra-links">

<a href="index.html">
Back Home
</a>

<a href="register.html">
Create Account
</a>

</div>

</div>

</div>

<script>

const LOGIN_API =
"https://furniturebackend-j767.onrender.com/api/auth/login";


// CHECK LOGIN

const token =
localStorage.getItem("token");

if(token){

window.location.href =
"profile.html";

}


// LOGIN FUNCTION

async function loginUser(){

try{

const email =
document.getElementById(
"email"
).value.trim();

const password =
document.getElementById(
"password"
).value.trim();


// VALIDATION

if(!email || !password){

alert(
"Enter Email And Password"
);

return;

}


// API CALL

const response =
await fetch(

LOGIN_API,

{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

email,
password

})

}

);


const data =
await response.json();


// SUCCESS LOGIN

if(data.success){

// SAVE TOKEN

localStorage.setItem(
"token",
data.token
);


// SAVE USERNAME

localStorage.setItem(
"username",
data.user?.username || "User"
);


// SAVE EMAIL

localStorage.setItem(
"userEmail",
data.user?.email || ""
);


// SAVE PHONE

localStorage.setItem(
"userPhone",
data.user?.phone || ""
);


alert(
"Login Success"
);


// REDIRECT

window.location.href =
"profile.html";

}
else{


// NEW USER

if(data.message === "User not found"){

alert(
"New User Please Register First"
);

window.location.href =
"register.html";

}
else{

alert(
data.message || "Login Failed"
);

}

}

}
catch(error){

console.log(error);

alert(
"Something Went Wrong"
);

}

}


// LOGOUT

function logout(){

localStorage.removeItem(
"token"
);

localStorage.removeItem(
"username"
);

localStorage.removeItem(
"userEmail"
);

localStorage.removeItem(
"userPhone"
);

window.location.href =
"login.html";

}

</script>

</body>

</html>
