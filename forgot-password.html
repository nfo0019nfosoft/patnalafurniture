<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Forgot Password</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

background:
linear-gradient(
135deg,
#2b1408,
#874526,
#c99330
);

padding:20px;
}

.box{

width:100%;
max-width:450px;

background:
rgba(255,255,255,0.12);

backdrop-filter:blur(18px);

padding:40px;

border-radius:30px;

color:#fff;

box-shadow:
0 15px 40px rgba(0,0,0,0.2);
}

.box h1{

text-align:center;

margin-bottom:10px;

font-size:2.2rem;
}

.box p{

text-align:center;

margin-bottom:30px;

color:#eee;
}

.input-box{

margin-bottom:18px;

position:relative;
}

.input-box i{

position:absolute;

top:18px;
left:15px;

color:#c99330;
}

.input-box input{

width:100%;

padding:15px 15px 15px 45px;

border:none;

outline:none;

border-radius:12px;

background:
rgba(255,255,255,0.12);

color:#fff;

font-size:1rem;
}

.input-box input::placeholder{

color:#ddd;
}

button{

width:100%;

padding:15px;

border:none;

border-radius:12px;

background:
linear-gradient(
90deg,
#874526,
#c99330
);

color:#fff;

font-size:1rem;

font-weight:600;

cursor:pointer;

margin-bottom:15px;
}

</style>

</head>

<body>


<div class="box">

<h1>

Forgot Password

</h1>

<p>

Reset your password securely

</p>



<div class="input-box">

<i class="fa-solid fa-envelope"></i>

<input
type="email"
id="email"
placeholder="Enter Email"
>

</div>


<button onclick="sendOtp()">

Send OTP

</button>



<div class="input-box">

<i class="fa-solid fa-key"></i>

<input
type="text"
id="otp"
placeholder="Enter OTP"
>

</div>



<div class="input-box">

<i class="fa-solid fa-lock"></i>

<input
type="password"
id="newPassword"
placeholder="New Password"
>

</div>



<button onclick="resetPassword()">

Reset Password

</button>

</div>





<script>

const API =
"https://furniturebackend-j767.onrender.com/api/auth";



// SEND OTP

async function sendOtp(){

try{

const email =
document.getElementById(
"email"
).value;


const response =
await fetch(

`${API}/send-otp`,

{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

email

})

}

);


const data =
await response.json();

alert(
data.message
);

}
catch(error){

console.log(error);

alert(
"Failed To Send OTP"
);

}

}



// RESET PASSWORD

async function resetPassword(){

try{

const email =
document.getElementById(
"email"
).value;

const otp =
document.getElementById(
"otp"
).value;

const newPassword =
document.getElementById(
"newPassword"
).value;


const response =
await fetch(

`${API}/reset-password`,

{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

email,
otp,
newPassword

})

}

);


const data =
await response.json();

alert(
data.message
);


if(data.success){

window.location.href =
"login.html";

}

}
catch(error){

console.log(error);

alert(
"Something Went Wrong"
);

}

}

</script>

</body>

</html>
